<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mount Rushmore of OOP</title>
    <meta name="description" content="Four principles built everything you use. Encapsulation, Abstraction, Inheritance and Polymorphism as four monuments." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060a'/%3E%3Cpath d='M6 26V12l4-4 4 4v14M14 26V10l4-4 4 4v16M22 26V14l3-3 3 3v12' fill='none' stroke='%23e9e4da' stroke-width='1.6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/hub.css" />
    <link rel="stylesheet" href="/src/styles/cursor.css" />
    <link rel="stylesheet" href="/src/styles/entrance.css" />
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div class="mist" aria-hidden="true"></div>

    <!-- Hub overlay -->
    <main id="hub" class="hub" data-state="intro">
      <section class="intro" aria-live="polite">
        <h1 class="intro__line" data-intro-line>Four principles built everything you use.</h1>
        <div class="intro__gate" data-intro-cue>
          <button class="enter" data-enter="sound" data-magnetic>
            <span class="enter__label" data-magnetic-inner>Enter with sound</span>
            <span class="enter__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </button>
          <button class="enter-quiet mono" data-enter="silent">or enter in silence</button>
        </div>
      </section>

      <div class="label" data-label aria-hidden="true">
        <p class="label__meta mono" data-label-meta></p>
        <h2 class="label__name" data-label-name></h2>
        <p class="label__line mono" data-label-line></p>
      </div>

      <nav class="monuments" aria-label="Choose a monument" data-nav>
        <p class="monuments__prompt mono">Choose a monument</p>
        <ul class="monuments__list" data-nav-list></ul>
      </nav>

      <a class="credit mono" data-credit target="_blank" rel="noopener"></a>
    </main>

    <div id="worlds"></div>

    <div class="preloader" data-preloader aria-hidden="true">
      <p class="preloader__corner preloader__corner--tl mono">Mount Rushmore of OOP</p>
      <p class="preloader__corner preloader__corner--tr mono">I · II · III · IV</p>
      <div class="preloader__count" data-count>000</div>
      <div class="preloader__rule"><span data-rule></span></div>
      <p class="preloader__status mono">Carving the mountain</p>
      <p class="preloader__corner preloader__corner--bl mono">[ Sound recommended ]</p>
      <p class="preloader__corner preloader__corner--br mono">Four principles · one mountain</p>
    </div>

    <button class="sound mono" data-sound aria-pressed="false" aria-label="Sound" data-magnetic>
      <span class="sound__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="sound__label" data-sound-label>Sound off</span>
    </button>
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
